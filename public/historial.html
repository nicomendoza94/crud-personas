<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de búsquedas | Registro de personas</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <script type="module" src="/js/historial.js"></script>
</head>
<body>
  <header class="cabecera">
    <div>
      <h1>Registro de personas</h1>
      <p class="aviso-sintetico">Todos los datos de este sistema son sintéticos.</p>
    </div>
    <nav class="navegacion" aria-label="Secciones">
      <a href="/">Personas</a>
      <a href="/historial.html" aria-current="page">Historial de búsquedas</a>
    </nav>
  </header>

  <main class="contenido">
    <h2>Historial de búsquedas</h2>
    <!-- Política de retención: el texto lo completa historial.js con el valor del servidor -->
    <p id="info-retencion" class="ayuda"></p>

    <p id="mensaje" class="mensaje" role="status" aria-live="polite" hidden></p>

    <div class="tabla-contenedor">
      <table class="tabla tabla-historial">
        <thead>
          <tr>
            <th scope="col">Fecha y hora</th>
            <th scope="col">Término</th>
            <th scope="col">Criterio</th>
            <th scope="col">Resultados</th>
            <th scope="col">IP de origen</th>
            <th scope="col">Ubicación</th>
            <th scope="col">Telegram</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </div>

    <nav class="paginacion" aria-label="Paginación del historial">
      <button type="button" id="boton-anterior" class="boton">Anterior</button>
      <span id="info-pagina"></span>
      <button type="button" id="boton-siguiente" class="boton">Siguiente</button>
    </nav>
  </main>
</body>
</html>
